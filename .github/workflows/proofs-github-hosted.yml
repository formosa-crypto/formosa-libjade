name: proofs (GitHub-hosted)

# The proofs of proofs.yml, on GitHub-hosted runners instead of the
# self-hosted ones: one job per scenario of proofs/Makefile, each on its own
# ubuntu-latest runner (4 CPUs, 16 GB for a public repository). The toolchain
# of flake.nix is built once, by the toolchain job, and passed to the
# scenario jobs as a cache of the Nix store.

on:
  workflow_dispatch:
  push:
    branches: [ci-gh-proofs]

permissions:
  contents: read

env:
  NIX_CONFIG: 'experimental-features = nix-command flakes'

jobs:
  # The toolchain, in the Nix store, cached under a key made of the files it
  # is built from and of the EasyCrypt commit its pin follows (the head of
  # the pinned branch).
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache key
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ hashFiles('flake.nix', 'flake.lock', 'formosa-libjade.opam', '.ocaml-version') }}
        run: |
          branch=$(sed -n 's|.*"git+https://github.com/EasyCrypt/easycrypt.git#\([^"]*\)".*|\1|p' \
                     formosa-libjade.opam)
          rev=$(gh api "repos/EasyCrypt/easycrypt/commits/$branch" --jq .sha)
          echo "key=proofs-toolchain-$RUNNER_OS-$FILES-$rev" >> "$GITHUB_OUTPUT"

      # The build of the OCaml packages needs more than the free space of
      # the runner's disk.
      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: cachix/install-nix-action@v32.1.0

      # Saved at the end of the job, after a garbage collection that keeps
      # the closure of the development shell only (the profile below is a
      # root).
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: ${{ steps.key.outputs.key }}
          gc-max-store-size-linux: 0

      - name: Toolchain
        run: nix develop --impure --profile "$RUNNER_TEMP/proofs-shell" --command true

  # One scenario of proofs/Makefile per job, with two EasyCrypt jobs (each smt
  # call runs CVC5 and Z3 side by side).
  scenario:
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - core
          - fips202
          - mldsa
          - mldsa-avx2-generic
          - mldsa-avx2-44
          - mldsa-avx2-65
          - mldsa-avx2-87
          - mlkem
          - mlkem-avx2-generic
          - mlkem-avx2-512
          - mlkem-avx2-768
          - mlkem-avx2-1024
          - mlkem-safety
          - mldsa-safety
          - fips202-safety
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v32.1.0

      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: ${{ needs.toolchain.outputs.key }}
          fail-on: primary-key.miss
          save: false

      - name: Configuration
        run: |
          nix develop --impure --command sh -c '
            z3 --version; cvc5 --version | head -1; nproc; free -g
            easycrypt why3config
            easycrypt config'

      - name: Check proofs
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: nix develop --impure --command make -C proofs "$SCENARIO" JOBS=2

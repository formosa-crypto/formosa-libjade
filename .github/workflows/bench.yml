name: bench

# Runs the cycle benchmark on a self-hosted runner (label "bench") and publishes
# the report to the workflow run's Job Summary. See .github/runner/README.md for runner
# provisioning and the public-repo security model. A machine that already
# benchmarked the commit's tree in a successful run (a rebase that changes no
# file, a rebase merge) reuses that run's report instead, except in a manual
# run: the toolchain is the flake's, in the tree.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# GitHub keeps at most one pending run per concurrency group, so a shared
# group would cancel the queued runs of the other PRs; the runners queue the
# jobs instead. A PR has its own group, where a new push cancels the run in
# progress; every other run has a group of its own.
concurrency:
  group: >-
    bench-${{ github.event_name == 'pull_request_target'
              && format('pr-{0}', github.event.pull_request.number)
              || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

# The toolchain (jasminc + a pinned C compiler) comes from flake.nix's bench
# shell, served by the host's shared nix store (MOUNT_NIX=1 on the runner
# instance; see .github/runner/README.md). --impure lets the flake's easycrypt
# pin-depends resolve (bench never builds it, but the solver sees it).
env:
  NIX_CONFIG: 'experimental-features = nix-command flakes'
  BENCHDEV: nix develop .#bench --impure --command
  HEAD: >-
    ${{ github.event_name == 'pull_request_target'
        && github.event.pull_request.head.sha
        || github.sha }}

jobs:
  # The machines that benchmark this commit and those that reuse an earlier
  # run, on a GitHub-hosted runner, so that a reuse waits for no bench
  # machine. Its code is the base branch's (pull_request_target).
  # dispatch/push run unconditionally; a PR runs only when it is from this
  # repo (never a fork), so untrusted fork code can never execute on the
  # self-hosted machine.
  earlier:
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      # One job per bench machine; each runner instance advertises a
      # bench-<cpu> label naming its microarchitecture (E3-1245 v5 = Skylake).
      RUNNERS: '["bench-skylake"]'
    outputs:
      all: ${{ env.RUNNERS }}
      markers: ${{ steps.find.outputs.markers || '{}' }}
      todo: ${{ steps.plan.outputs.todo }}
      reused: ${{ steps.plan.outputs.reused }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      # A failed lookup only means benchmarking again.
      - id: find
        continue-on-error: true
        uses: ./.github/actions/earlier-run
        with:
          commit: ${{ env.HEAD }}
          marker: bench-ok-{label}-{tree}
          labels: ${{ env.RUNNERS }}
          lookup: ${{ github.event_name != 'workflow_dispatch' }}
      - id: plan
        env:
          RUNS: ${{ steps.find.outputs.runs || '{}' }}
        run: |
          echo "todo=$(jq -cn --argjson all "$RUNNERS" --argjson runs "$RUNS" \
            '$all - ($runs | keys)')" >> "$GITHUB_OUTPUT"
          echo "reused=$(jq -cn --argjson runs "$RUNS" \
            '[$runs | to_entries[] | {runner: .key, run: .value}]')" >> "$GITHUB_OUTPUT"

  bench:
    needs: earlier
    if: needs.earlier.outputs.todo != '[]'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.earlier.outputs.todo) }}
    runs-on: [self-hosted, linux, x64, '${{ matrix.runner }}']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
          ref: ${{ env.HEAD }}

      # Builds (or reuses from the host store) the bench toolchain.
      - name: Toolchain
        run: $BENCHDEV true

      - name: Versions
        run: |
          $BENCHDEV jasminc -version
          $BENCHDEV cc --version | head -1

      - name: Build
        run: |
          $BENCHDEV make -C src
          $BENCHDEV make -C bench libs

      # Correctness gate: fail before benching if any backend diverges from KAT.
      - name: KAT
        run: >-
          $BENCHDEV make -C bench test
          BACKENDS='jasmin mlkem-native mldsa-native pqcrystals pqcrystals-ref'

      # REPS interleaved passes (bench/Makefile); bench.json carries every
      # pass with its spread and the run metadata.
      - name: Benchmark + report
        run: $BENCHDEV make -C bench report META='runner=${{ matrix.runner }}'

      - name: Job summary
        env:
          RUNNER: ${{ matrix.runner }}
          PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
          PUBLISHED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: >-
          $BENCHDEV python3 -I scripts/job-summary.py bench bench/bench.json "$RUNNER"
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench artifact
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.runner }}
          path: |
            bench/bench.json
            bench/bench.md
            bench/_build/bench.csv

      # The mark of a successful benchmark of this tree on this machine,
      # found by later runs.
      - name: Marker
        run: git rev-parse HEAD > bench-ok

      - name: Upload marker
        if: fromJSON(needs.earlier.outputs.markers)[matrix.runner]
        uses: actions/upload-artifact@v7
        with:
          name: ${{ fromJSON(needs.earlier.outputs.markers)[matrix.runner] }}
          path: bench-ok

  # The report of the earlier run of a machine, rewritten for this commit, as
  # this run's artifact. Runs the base branch's code only: the commit is
  # fetched as data.
  reuse:
    needs: earlier
    if: needs.earlier.outputs.reused != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.earlier.outputs.reused) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Commit
        run: git fetch -q --depth 1 origin "$HEAD"
      - uses: actions/download-artifact@v8
        with:
          name: bench-${{ matrix.runner }}
          path: bench
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
      - name: Report for this commit
        run: python3 -I scripts/ci-retarget.py bench/bench.json "$HEAD"
      - name: Job summary
        env:
          RUNNER: ${{ matrix.runner }}
          PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
          PUBLISHED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: >-
          python3 -I scripts/job-summary.py bench bench/bench.json "$RUNNER"
          >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.runner }}
          path: |
            bench/bench.json
            bench/bench.md
            bench/_build/bench.csv

  # Add each machine's bench JSON to the results repo
  # (https://github.com/formosa-crypto/formosa-libjade-results): pushes to main go to main's
  # history (data/bench/<runner>), runs of PRs to that PR's own
  # space (data/pr/<number>/bench/<runner>), with the PR's merge base for the
  # comparison. A separate job on a GitHub-hosted runner: it runs only this
  # (base-branch) workflow's code and downloads the artifact as data, so no PR
  # code ever shares a job with the deploy key, which never reaches a bench
  # machine either.
  publish:
    needs: [earlier, bench, reuse]
    if: >-
      !cancelled() && needs.earlier.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'pull_request_target')
    strategy:
      matrix:
        runner: ${{ fromJSON(needs.earlier.outputs.all) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: bench-${{ matrix.runner }}
          path: result
      # Where the record goes, from the event (trusted) rather than from the
      # artifact (produced by the benchmarked code).
      - name: Target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUNNER: ${{ matrix.runner }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request_target ]; then
            mb=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" \
                   --jq '[.merge_base_commit.sha, .merge_base_commit.commit.committer.date] | @tsv')
            meta=$(MB="$mb" python3 -I -c '
          import json, os
          sha, date = os.environ["MB"].split("\t")
          print(json.dumps({"pr": {"number": int(os.environ["PR"]), "title": os.environ["TITLE"],
                                   "head_ref": os.environ["HEAD_REF"], "base": os.environ["BASE"],
                                   "merge_base": sha, "merge_base_date": date}}))')
            { echo "dest=data/pr/$PR/bench/$RUNNER"; echo "commit=$HEAD"; echo "meta=$meta"; } >> "$GITHUB_OUTPUT"
          else
            { echo "dest=data/bench/$RUNNER"; echo "commit=$GITHUB_SHA"; echo "meta={}"; } >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/publish-result
        with:
          file: result/bench.json
          dest: ${{ steps.target.outputs.dest }}
          commit: ${{ steps.target.outputs.commit }}
          meta: ${{ steps.target.outputs.meta }}
          deploy-key: ${{ secrets.TIMING_DEPLOY_KEY }}

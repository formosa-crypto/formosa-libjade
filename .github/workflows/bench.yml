name: bench

# Runs the cycle benchmark on a self-hosted runner (label "bench") and publishes
# the report to the workflow run's Job Summary. See .github/runner/README.md for runner
# provisioning and the public-repo security model.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read

# GitHub keeps at most one pending run per concurrency group, so a shared
# group would cancel the queued runs of the other PRs; the runners queue the
# jobs instead. A PR has its own group, where a new push cancels the run in
# progress; every other run has a group of its own.
concurrency:
  group: >-
    bench-${{ github.event_name == 'pull_request_target'
              && format('pr-{0}', github.event.pull_request.number)
              || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

# The toolchain (jasminc + a pinned C compiler) comes from flake.nix's bench
# shell, served by the host's shared nix store (MOUNT_NIX=1 on the runner
# instance; see .github/runner/README.md). --impure lets the flake's easycrypt
# pin-depends resolve (bench never builds it, but the solver sees it).
env:
  NIX_CONFIG: 'experimental-features = nix-command flakes'
  BENCHDEV: nix develop .#bench --impure --command

jobs:
  bench:
    # dispatch/push run unconditionally; a PR runs only when a maintainer has
    # applied the "bench" label AND the PR is from this repo (never a fork), so
    # untrusted fork code can never execute on the self-hosted machine.
    if: >-
      github.event_name != 'pull_request_target' ||
      (contains(github.event.pull_request.labels.*.name, 'bench') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # One job per bench machine; each runner instance advertises a bench-<cpu>
    # label naming its microarchitecture (E3-1245 v5 = Skylake).
    strategy:
      fail-fast: false
      matrix:
        runner: [bench-skylake]
    runs-on: [self-hosted, linux, x64, '${{ matrix.runner }}']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
          ref: >-
            ${{ github.event_name == 'pull_request_target'
                && github.event.pull_request.head.sha
                || github.sha }}

      # Builds (or reuses from the host store) the bench toolchain.
      - name: Toolchain
        run: $BENCHDEV true

      - name: Versions
        run: |
          $BENCHDEV jasminc -version
          $BENCHDEV cc --version | head -1

      - name: Build
        run: |
          $BENCHDEV make -C src
          $BENCHDEV make -C bench libs

      # Correctness gate: fail before benching if any backend diverges from KAT.
      - name: KAT
        run: >-
          $BENCHDEV make -C bench test
          BACKENDS='jasmin mlkem-native mldsa-native pqcrystals pqcrystals-ref'

      # REPS interleaved passes (bench/Makefile); bench.json carries every
      # pass with its spread and the run metadata.
      - name: Benchmark + report
        run: $BENCHDEV make -C bench report META='runner=${{ matrix.runner }}'

      # On main the results are published (publish job below): link the
      # dashboard's comparison with the previous commit and fold the full
      # report. Elsewhere (branches, labelled PRs) show the report itself.
      # Links to the results dashboard rather than tables: on main the
      # commit's results and its comparison with the previous commit, on a
      # labelled PR the comparison with its merge base. Other runs are not
      # published: the full report is in the artifact.
      - name: Job summary
        env:
          SITE: https://www.strub.nu/jasmin-nist-timing
          PUBLISHED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
          RUNNER: ${{ matrix.runner }}
        run: |
          if [ -n "$PR" ]; then
            msg="**[compare with the merge base]($SITE/#/pr/$PR)** on the results dashboard (updated a minute after this run)."
          elif [ "$PUBLISHED" = true ]; then
            msg="**[results for this commit]($SITE/#/results/$GITHUB_SHA)** · **[compare with the previous commit]($SITE/#/compare/$GITHUB_SHA)** on the results dashboard (updated a minute after this run)."
          else
            msg="not published (only main and labelled PRs are); the full report is in the \`bench-$RUNNER\` artifact."
          fi
          echo "Benchmarks on \`$RUNNER\`: $msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench artifact
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.runner }}
          path: |
            bench/bench.json
            bench/bench.md
            bench/_build/bench.csv

  # Add each machine's bench JSON to the results repo
  # (https://github.com/strub/jasmin-nist-timing): pushes to main go to main's
  # history (data/bench/<runner>), runs of labelled PRs to that PR's own
  # space (data/pr/<number>/bench/<runner>), with the PR's merge base for the
  # comparison. A separate job on a GitHub-hosted runner: it runs only this
  # (base-branch) workflow's code and downloads the artifact as data, so no PR
  # code ever shares a job with the deploy key, which never reaches a bench
  # machine either. Keep the matrix in sync with bench's.
  publish:
    needs: bench
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request_target'
    strategy:
      matrix:
        runner: [bench-skylake]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: bench-${{ matrix.runner }}
          path: result
      # Where the record goes, from the event (trusted) rather than from the
      # artifact (produced by the benchmarked code).
      - name: Target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUNNER: ${{ matrix.runner }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request_target ]; then
            mb=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" \
                   --jq '[.merge_base_commit.sha, .merge_base_commit.commit.committer.date] | @tsv')
            meta=$(MB="$mb" python3 -I -c '
          import json, os
          sha, date = os.environ["MB"].split("\t")
          print(json.dumps({"pr": {"number": int(os.environ["PR"]), "title": os.environ["TITLE"],
                                   "head_ref": os.environ["HEAD_REF"], "base": os.environ["BASE"],
                                   "merge_base": sha, "merge_base_date": date}}))')
            { echo "dest=data/pr/$PR/bench/$RUNNER"; echo "commit=$HEAD"; echo "meta=$meta"; } >> "$GITHUB_OUTPUT"
          else
            { echo "dest=data/bench/$RUNNER"; echo "commit=$GITHUB_SHA"; echo "meta={}"; } >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/publish-result
        with:
          file: result/bench.json
          dest: ${{ steps.target.outputs.dest }}
          commit: ${{ steps.target.outputs.commit }}
          meta: ${{ steps.target.outputs.meta }}
          deploy-key: ${{ secrets.TIMING_DEPLOY_KEY }}

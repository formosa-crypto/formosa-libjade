name: checks

# The checks of the Jasmin sources and of the committed EasyCrypt models,
# one result per check and target (scripts/checks.py, made of the same
# `make` targets as a local run), on the implementations that claim the
# check in their src/**/meta.toml:
#  - ct: constant time and speculative constant time (`jasmin-ct`);
#  - extraction: the committed models are the jasmin2ec extraction of src/,
#    the committed assembly (asm/) its jasminc compilation;
#  - kat-memcheck: the known-answer tests of bench/vectors, then Valgrind's
#    memcheck (x86-64 + AVX2 runners).
# The results make one record per commit (checks.py merge), added
# to the results repo by the publish job below, for main and for pull
# requests. A commit whose tree a successful run already checked (a
# rebase that changes no file, a rebase merge) reuses that run's record
# instead, except in a manual run: the toolchain is the flake's, in the tree.
#
# Security: a pull request runs this workflow as it is on main
# (pull_request_target). A PR from this repo runs on every push. A fork's PR
# runs only when a maintainer, once the PR is reviewed, adds the label
# "safe to test", and then at the commit it had when labelled; a push to the
# fork removes the label (safe-to-test.yml). Unreviewed fork code never runs
# on the self-hosted machines, which refuse it too
# (.github/runner/job-started.sh). The deploy key of the results repo is only
# used by the publish job, which runs no checked code.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# A PR has its own group, where a new push cancels the run in progress
# (with pull_request_target, github.ref is the base branch). Any other label
# than "safe to test" on a fork's PR has a group of its own: labelling a PR
# cancels nothing.
concurrency:
  group: >-
    checks-${{ github.event.action == 'labeled'
               && (github.event.label.name != 'safe to test'
                   || github.event.pull_request.head.repo.full_name == github.repository)
               && format('label-{0}', github.run_id)
               || github.event_name == 'pull_request_target'
               && format('pr-{0}', github.event.pull_request.number)
               || github.ref }}
  cancel-in-progress: true

# The bench shell has jasmin (jasminc, jasmin-ct), a pinned C toolchain and
# Valgrind; the extraction shell adds the jasmin2ec of the safety models.
# --impure lets the flake's easycrypt pin-depends resolve (these jobs never
# build it, but the solver sees it). A pull request is checked at its head
# commit, the commit its record is for.
env:
  NIX_CONFIG: 'experimental-features = nix-command flakes'
  BENCHDEV: nix develop .#bench --impure --command
  XDEV: nix develop .#extraction --impure --command
  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # The earlier successful run on the same tree, if any. Every other job needs
  # this one, which runs only for a push, a manual run, a PR from this repo
  # or a fork's PR labelled "safe to test"; its code is the base branch's.
  earlier:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.action != 'labeled' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.action == 'labeled' && github.event.label.name == 'safe to test' &&
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      marker: ${{ fromJSON(steps.find.outputs.markers || '{}').run }}
      run: ${{ fromJSON(steps.find.outputs.runs || '{}').run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      # A failed lookup only means checking again.
      - id: find
        continue-on-error: true
        uses: ./.github/actions/earlier-run
        with:
          commit: ${{ env.HEAD }}
          marker: checks-ok-{tree}
          lookup: ${{ github.event_name != 'workflow_dispatch' }}

  ct:
    needs: earlier
    if: needs.earlier.result == 'success' && !needs.earlier.outputs.run
    runs-on: [self-hosted, linux, proofs]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD }}
          submodules: false
          persist-credentials: false

      - name: Toolchain
        run: $BENCHDEV true

      - name: CT and SCT
        run: $BENCHDEV python3 -I scripts/checks.py ct checks/ct.jsonl

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: checks-ct
          path: checks/ct.jsonl

  extraction:
    needs: earlier
    if: needs.earlier.result == 'success' && !needs.earlier.outputs.run
    runs-on: [self-hosted, linux, proofs]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD }}
          submodules: false
          persist-credentials: false

      - name: Toolchain
        run: $XDEV true

      - name: Extracted models and assembly
        run: $XDEV python3 -I scripts/checks.py extraction checks/extraction.jsonl

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: checks-extraction
          path: checks/extraction.jsonl

  kat-memcheck:
    needs: earlier
    if: needs.earlier.result == 'success' && !needs.earlier.outputs.run
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD }}
          submodules: false
          persist-credentials: false

      - name: Toolchain
        run: $BENCHDEV true

      - name: KAT and memcheck
        run: $BENCHDEV python3 -I scripts/checks.py kat-memcheck checks/kat-memcheck.jsonl

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: checks-kat-memcheck
          path: checks/kat-memcheck.jsonl

  # The record of the commit, from the results of the three jobs, whatever
  # their outcome (a failed check is recorded too), with the end of the log
  # of every job that failed: the record must not depend on the run's logs,
  # which GitHub deletes after the retention period. Or the record of the
  # earlier run on the same tree, rewritten for this commit.
  record:
    needs: [earlier, ct, extraction, kat-memcheck]
    if: ${{ !cancelled() && needs.earlier.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD }}
          persist-credentials: false
      - name: Reuse the earlier record
        if: needs.earlier.outputs.run
        uses: actions/download-artifact@v8
        with:
          name: checks-record
          path: earlier
          run-id: ${{ needs.earlier.outputs.run }}
          github-token: ${{ github.token }}
      - name: Record for this commit
        if: needs.earlier.outputs.run
        run: |
          cp earlier/checks.json checks.json
          python3 -I scripts/ci-retarget.py checks.json
      - uses: actions/download-artifact@v8
        if: ${{ !needs.earlier.outputs.run }}
        with:
          pattern: checks-*
          path: checks
          merge-multiple: true
      - name: Logs of the failed jobs
        if: ${{ !needs.earlier.outputs.run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p logs
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" > "logs/$name.log" || true
          done
      # The jobs of the checks, without the lookup of an earlier run.
      - name: Record
        if: ${{ !needs.earlier.outputs.run }}
        env:
          NEEDS: ${{ toJSON(needs) }}
          JOB_LOGS: logs
        run: |
          JOBS=$(printf '%s' "$NEEDS" | jq -c 'del(.earlier)') \
            python3 -I scripts/checks.py merge checks.json checks/*.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: checks-record
          path: checks.json
      # The mark of a successful check of this tree, found by later runs.
      - name: Marker
        id: marker
        if: >-
          needs.earlier.outputs.run ||
          (needs.ct.result == 'success' && needs.extraction.result == 'success' &&
           needs.kat-memcheck.result == 'success')
        run: git rev-parse HEAD > checks-ok
      - name: Upload marker
        if: steps.marker.outcome == 'success' && needs.earlier.outputs.marker
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.earlier.outputs.marker }}
          path: checks-ok

  # Add the record to the results repo
  # (https://github.com/formosa-crypto/formosa-libjade-results): pushes to main
  # go to main's history, runs of PRs to the PR's own space. A separate job on
  # a GitHub-hosted runner: it only downloads the record, so the deploy key
  # never reaches a self-hosted machine nor shares a job with the checks.
  publish:
    needs: record
    if: >-
      !cancelled() && needs.record.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'pull_request_target')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: checks-record
          path: result
      - id: target
        uses: ./.github/actions/result-target
        with:
          kind: checks
      - uses: ./.github/actions/publish-result
        with:
          file: result/checks.json
          dest: ${{ steps.target.outputs.dest }}
          commit: ${{ steps.target.outputs.commit }}
          meta: ${{ steps.target.outputs.meta }}
          deploy-key: ${{ secrets.TIMING_DEPLOY_KEY }}

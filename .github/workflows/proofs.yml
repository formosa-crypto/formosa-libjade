name: proofs

# Checks every proof on pushes to main and on every pull request; a new push
# to a PR cancels its run in progress. A commit whose tree a successful run
# already checked with the same EasyCrypt (a rebase that changes no file, a
# rebase merge) reuses that run's results instead, except in a manual run.
#
# Security: a pull request runs this workflow as it is on main
# (pull_request_target), and only when it comes from this repo: the code of
# a fork never runs on the self-hosted machines. A fork's PR is checked by
# pushing its branch to this repo once reviewed, and running the workflow on
# that branch by hand (published by publish-pr). The deploy key of the
# results repo is only used by the publish job, which runs no checked code.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A PR has its own group, where a new push cancels the run in progress
# (with pull_request_target, github.ref is the base branch).
concurrency:
  group: >-
    proofs-${{ github.event_name == 'pull_request_target'
               && format('pr-{0}', github.event.pull_request.number)
               || github.ref }}
  cancel-in-progress: true

# The toolchain (jasmin + EasyCrypt + provers + python) comes from flake.nix,
# itself derived from formosa-libjade.opam via opam-nix; the host's /nix/store
# carries it between jobs, so there is nothing to cache on the GitHub side.
# --impure lets the easycrypt pin-depends follow its branch HEAD (the
# equivalent of `opam update` advancing the pin).
env:
  NIX_CONFIG: 'experimental-features = nix-command flakes'
  ECDEV: nix develop --impure --command
  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # The earlier successful run on the same tree and the same EasyCrypt, on a
  # GitHub-hosted runner, so that a reuse waits for no proofs runner. The
  # EasyCrypt commit is its pinned branch's head: if the store lags behind
  # it, the marker of the run (from the EasyCrypt it used) is not found and
  # the proofs are checked again. Every other job needs this one, which runs
  # only for a push, a manual run or a PR from this repo; its code is the base
  # branch's, the commit's opam file is read as data.
  earlier:
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ fromJSON(steps.find.outputs.runs || '{}').run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      # A failed lookup only means checking again.
      - name: EasyCrypt
        id: easycrypt
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          opam=$(gh api "repos/$GITHUB_REPOSITORY/contents/formosa-libjade.opam?ref=$HEAD" \
                   -H "Accept: application/vnd.github.raw")
          branch=$(printf '%s\n' "$opam" | sed -n 's|.*"git+https://github.com/EasyCrypt/easycrypt.git#\([^"]*\)".*|\1|p')
          echo "rev=$(gh api "repos/EasyCrypt/easycrypt/commits/$branch" --jq .sha)" >> "$GITHUB_OUTPUT"
      - id: find
        continue-on-error: true
        uses: ./.github/actions/earlier-run
        with:
          commit: ${{ env.HEAD }}
          marker: proofs-ok-{tree}-${{ steps.easycrypt.outputs.rev }}
          lookup: ${{ github.event_name != 'workflow_dispatch' && steps.easycrypt.outputs.rev != '' }}

  check-ec-proofs:
    needs: earlier
    if: needs.earlier.result == 'success' && !needs.earlier.outputs.run
    runs-on: [self-hosted, linux, proofs]
    timeout-minutes: 240
    steps:
      # A pull request is checked at its head commit, the commit its timing
      # record is for.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD }}
          submodules: false
          persist-credentials: false

      # Builds (or reuses from the store) the whole toolchain; this is the
      # long step on a cold store or after an easycrypt pin advance.
      - name: Toolchain
        run: $ECDEV true

      - name: Why3 configuration
        run: |
          $ECDEV sh -c 'z3 --version; cvc5 --version | head -1'
          $ECDEV easycrypt why3config

      - name: EasyCrypt configuration
        run: $ECDEV easycrypt config

      # One EasyCrypt job per two CPUs the runner's container is pinned to
      # (CPUSET in its instance env): each smt call runs CVC5 and Z3 side by
      # side, so one job per CPU oversubscribes the provers.
      - name: Jobs
        run: echo "JOBS=$(( ($(nproc) + 1) / 2 ))" >> "$GITHUB_ENV"

      # All scenarios (the Makefile's default target) in one runtest
      # invocation, with a per-file report of the time and of the peak
      # memory (scripts/ecmem), and the memory of the whole run sampled
      # every second (scripts/memwatch.py).
      - name: Check proofs
        run: |
          $ECDEV sh -c '
            python3 scripts/memwatch.py proofs-samples.jsonl & watch=$!
            make -C proofs JOBS=$1 REPORT=timing.yml MEMORY=../proofs-maxrss.jsonl; rc=$?
            kill $watch; wait $watch
            exit $rc' sh "$JOBS"

      # Timing pipeline: runtest report and memory -> timing JSON -> sunburst
      # page, published as a run artifact.
      - name: Timing sunburst
        run: |
          $ECDEV python3 scripts/timing-report-to-json.py --jobs "$JOBS" \
            --memory proofs-maxrss.jsonl --samples proofs-samples.jsonl \
            proofs/timing.yml proofs-timing.json
          $ECDEV python3 scripts/timing-sunburst.py proofs-timing.json proofs-timing.html

      - name: Job summary
        env:
          PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
          PUBLISHED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: $ECDEV python3 -I scripts/job-summary.py proofs proofs-timing.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload timing artifact
        uses: actions/upload-artifact@v7
        with:
          name: proofs-timing
          path: |
            proofs/timing.yml
            proofs-timing.json
            proofs-timing.html

      # The mark of a successful check of this tree with this EasyCrypt,
      # found by later runs.
      - name: Marker
        id: marker
        run: |
          rev=$($ECDEV sh -c 'echo "$EASYCRYPT_REV"')
          tree=$(git rev-parse 'HEAD^{tree}')
          git rev-parse HEAD > proofs-ok
          case "$rev" in ''|unknown) echo "name=" ;; *) echo "name=proofs-ok-$tree-$rev" ;; esac >> "$GITHUB_OUTPUT"

      - name: Upload marker
        if: steps.marker.outputs.name
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.marker.outputs.name }}
          path: proofs-ok

  # The results of the earlier run, rewritten for this commit, as this run's
  # artifact.
  reuse:
    needs: earlier
    if: needs.earlier.outputs.run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: proofs-timing
          path: .
          run-id: ${{ needs.earlier.outputs.run }}
          github-token: ${{ github.token }}
      - name: Results for this commit
        run: python3 -I scripts/ci-retarget.py proofs-timing.json
      - name: Job summary
        env:
          PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
          PUBLISHED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: python3 -I scripts/job-summary.py proofs proofs-timing.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: proofs-timing
          path: |
            proofs/timing.yml
            proofs-timing.json
            proofs-timing.html

  # Add this run's timing JSON to the results repo
  # (https://github.com/formosa-crypto/formosa-libjade-results): pushes to main
  # go to main's history, runs of PRs to the PR's own space. A separate job on
  # a GitHub-hosted runner: it only downloads the artifact, so the deploy key
  # never reaches the self-hosted machine nor shares a job with the
  # proof-checking steps.
  publish:
    needs: [check-ec-proofs, reuse]
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'pull_request_target') &&
      (needs.check-ec-proofs.result == 'success' || needs.reuse.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: proofs-timing
          path: result
      - id: target
        uses: ./.github/actions/result-target
        with:
          kind: proofs
      - uses: ./.github/actions/publish-result
        with:
          file: result/proofs-timing.json
          dest: ${{ steps.target.outputs.dest }}
          commit: ${{ steps.target.outputs.commit }}
          meta: ${{ steps.target.outputs.meta }}
          deploy-key: ${{ secrets.TIMING_DEPLOY_KEY }}

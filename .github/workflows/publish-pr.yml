name: publish-pr

# Adds the records of the runs started by hand on the branch of a pull
# request to the results repo
# (https://github.com/formosa-crypto/formosa-libjade-results), with the
# PR's merge base (the runs of the PR itself, pull_request_target, publish
# their records themselves):
#  - its proofs timing, as data/pr/<number>/proofs/<head>.json, once its
#    proofs run has succeeded;
#  - its checks record, as data/pr/<number>/checks/<head>.json, once its
#    checks run has completed (failed checks are recorded too).
#
# A manual run on a branch runs the branch's copy of the workflows, so it
# must never hold the deploy key. This workflow is triggered by its
# completion and always runs main's version (workflow_run): it only
# downloads the run's artifact as data, validates it, and takes the target
# (PR, head, merge base) from the event and the API.

on:
  workflow_run:
    workflows: [proofs, checks]
    types: [completed]

# actions: read to download the run's artifact; pull-requests: read for the
# PR's details (base, branch, title).
permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      (github.event.workflow_run.conclusion == 'success' ||
       (github.event.workflow_run.name == 'checks' &&
        github.event.workflow_run.conclusion == 'failure')) &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.workflow_run.name == 'proofs' && 'proofs-timing' || 'checks-record' }}
          path: result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          KIND: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          # The event may not list the PR (a dispatched run, or a PR merged or
          # closed before its run ended): find it from its head commit.
          # A run on a commit that is no PR's head publishes nothing.
          if [ -z "$PR" ]; then
            PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/pulls" \
                   --jq "[.[] | select(.head.sha == \"$HEAD\")][0].number // empty")
          fi
          if [ -z "$PR" ]; then
            echo "::notice::no pull request has $HEAD as head: nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          base=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["base"]["sha"])' "$RUNNER_TEMP/pr.json")
          mb=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$HEAD" \
                 --jq '[.merge_base_commit.sha, .merge_base_commit.commit.committer.date] | @tsv')
          meta=$(MB="$mb" python3 -I -c '
          import json, os, sys
          pr = json.load(open(sys.argv[1]))
          sha, date = os.environ["MB"].split("\t")
          print(json.dumps({"pr": {"number": pr["number"], "title": pr["title"],
                                   "head_ref": pr["head"]["ref"], "base": pr["base"]["sha"],
                                   "merge_base": sha, "merge_base_date": date}}))' "$RUNNER_TEMP/pr.json")
          case "$KIND" in
            proofs) file=result/proofs-timing.json ;;
            checks) file=result/checks.json ;;
          esac
          { echo "dest=data/pr/$PR/$KIND"; echo "file=$file"; echo "commit=$HEAD"; echo "meta=$meta"; } >> "$GITHUB_OUTPUT"
      - if: steps.target.outputs.skip != 'true'
        uses: ./.github/actions/publish-result
        with:
          file: ${{ steps.target.outputs.file }}
          dest: ${{ steps.target.outputs.dest }}
          commit: ${{ steps.target.outputs.commit }}
          meta: ${{ steps.target.outputs.meta }}
          deploy-key: ${{ secrets.TIMING_DEPLOY_KEY }}
